name: CI

on:
  pull_request:
  push:
    branches: [staging, production]

# the token only reads; nothing in CI writes to the repo
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # build is tsc -b (typecheck) then vite build
      - run: npm test
      - run: npm run build
